name: Lint & Format

on:
  pull_request:

jobs:
  lint:
    name: Lint Svelte Project
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run ESLint
      - name: Run ESLint
        run: npm run lint

      # Run Prettier check (dry run)
      - name: Run Prettier Check
        run: npx prettier --check .
