name: Publish to stores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v3.0.1) — must match package.json'
        required: true

env:
  PUBLIC_API_BASE_URL: https://aiki.zeeguu.dev/api/

jobs:
  verify_version:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME:-${{ inputs.version }}}"
          TAG_VERSION="${TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  publish_firefox:
    name: Publish Firefox (AMO listed)
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build Firefox source dir + sources zip
        run: npm run build:firefox && npm run package:sources
      - name: Submit to AMO listed channel
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: npm run publish:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error

  publish_chrome:
    name: Publish Chrome Web Store
    needs: verify_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run package:chrome
      - name: Upload + publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx -y chrome-webstore-upload-cli@3 upload \
            --source web-ext-artifacts/aiki3-chrome.zip \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN" \
            --auto-publish

  github_release:
    permissions: 
      contents: write
    name: Create GitHub release
    needs: [publish_firefox, publish_chrome]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: firefox-xpi
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.verify_version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*.xpi
          token: ${{ secrets.GITHUB_TOKEN }}
